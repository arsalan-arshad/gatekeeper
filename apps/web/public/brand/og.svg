<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Gatekeeper — Your AI front door that says no for you">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07110e"/>
      <stop offset="45%" stop-color="#0b1210"/>
      <stop offset="100%" stop-color="#101a16"/>
    </linearGradient>
    <radialGradient id="mintBloom" cx="72%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#5fd4a4" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#5fd4a4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#5fd4a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepBloom" cx="18%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#1b6b4f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1b6b4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2c24"/>
      <stop offset="55%" stop-color="#0d1713"/>
      <stop offset="100%" stop-color="#080e0b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd4a4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#5fd4a4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1b6b4f" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5fd4a4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5fd4a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef3ef" stop-opacity="0"/>
      <stop offset="40%" stop-color="#eef3ef" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#eef3ef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#mintBloom)"/>
  <rect width="1200" height="630" fill="url(#deepBloom)"/>

  <!-- arched doorway -->
  <g transform="translate(740, 70)">
    <ellipse cx="160" cy="250" rx="210" ry="250" fill="url(#doorGlow)"/>
    <path d="M40 520 V210 A120 120 0 0 1 280 210 V520 Z" fill="url(#doorFace)" stroke="url(#rim)" stroke-width="5"/>
    <path d="M82 492 V230 A78 78 0 0 1 238 230 V492 Z" fill="#050805" stroke="#eef3ef" stroke-opacity="0.08" stroke-width="2.5"/>
    <path d="M98 238 A62 62 0 0 1 222 238" stroke="#5fd4a4" stroke-opacity="0.32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58 492 V230 A100 100 0 0 1 160 130 V492 Z" fill="url(#sheen)"/>
    <circle cx="214" cy="340" r="6" fill="#5fd4a4" fill-opacity="0.9"/>
  </g>

  <!-- copy -->
  <text x="72" y="96" fill="#5fd4a4" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="6">GATEKEEPER</text>
  <text x="72" y="250" fill="#eef3ef" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="800">Gatekeeper</text>
  <text x="72" y="320" fill="#eef3ef" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500">Your AI front door that says no for you</text>
  <text x="72" y="380" fill="#8fa198" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22">Open-source AI principal · double-opt-in intros · public ledger</text>
</svg>
