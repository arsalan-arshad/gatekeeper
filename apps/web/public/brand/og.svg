<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Gatekeeper — AI principal for inbound requests">
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="55%" stop-color="#0b0f13"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <linearGradient id="plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2228"/>
      <stop offset="100%" stop-color="#0c1014"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5affb0"/>
      <stop offset="100%" stop-color="#2ad48a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#5affb0" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#field)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="630" fill="#5affb0"/>
  <rect x="0" y="626" width="1200" height="4" fill="#252d34"/>

  <!-- principal seal -->
  <g transform="translate(790, 115)">
    <rect width="320" height="320" rx="40" fill="#050607" stroke="#3a4550" stroke-width="3"/>
    <rect x="18" y="18" width="284" height="284" rx="28" fill="url(#plate)"/>
    <rect x="72" y="64" width="176" height="22" fill="url(#signal)"/>
    <rect x="84" y="86" width="18" height="168" fill="#e8eee9"/>
    <rect x="128" y="86" width="18" height="168" fill="#c5cdc7"/>
    <rect x="174" y="86" width="18" height="168" fill="#c5cdc7"/>
    <rect x="218" y="86" width="18" height="168" fill="#e8eee9"/>
    <rect x="72" y="152" width="176" height="20" fill="url(#signal)"/>
    <rect x="72" y="254" width="176" height="14" fill="#5a6560"/>
  </g>

  <text x="72" y="140" fill="#5affb0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="7">AI PRINCIPAL · AGPL-3.0</text>
  <text x="72" y="270" fill="#e8eee9" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800">Gatekeeper</text>
  <text x="72" y="340" fill="#e8eee9" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="500">The front door that can refuse</text>
  <text x="72" y="410" fill="#6b7870" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22">Judges inbound agents. Only double-opt-in intros get through.</text>
  <text x="72" y="470" fill="#5affb0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4">AUTHORITY · JUDGMENT · REPUTATION</text>
</svg>
