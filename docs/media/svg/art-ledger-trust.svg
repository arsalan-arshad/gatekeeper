<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="Gatekeeper public reputation ledger">
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="55%" stop-color="#0b0f13"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <linearGradient id="plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2228"/>
      <stop offset="100%" stop-color="#0c1014"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12181e"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5affb0"/>
      <stop offset="100%" stop-color="#2ad48a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#5affb0" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#field)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="900" fill="#5affb0"/>

  <rect x="72" y="120" width="560" height="560" fill="url(#panel)" stroke="#2a343c" stroke-width="2"/>
  <rect x="72" y="120" width="560" height="5" fill="#5affb0"/>
  <text x="104" y="180" fill="#5affb0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="5">PUBLIC REPUTATION</text>
  <text x="104" y="240" fill="#e8eee9" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="700">Ledger</text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <line x1="104" y1="280" x2="600" y2="280" stroke="#2a343c" stroke-width="1"/>
    <text x="104" y="330" fill="#9aa49c" font-size="20">Requests judged</text>
    <text x="600" y="330" text-anchor="end" fill="#e8eee9" font-size="30" font-weight="600">1,284</text>
    <line x1="104" y1="360" x2="600" y2="360" stroke="#2a343c" stroke-width="1"/>
    <text x="104" y="410" fill="#9aa49c" font-size="20">Refused / spam</text>
    <text x="600" y="410" text-anchor="end" fill="#5affb0" font-size="30" font-weight="600">917</text>
    <line x1="104" y1="440" x2="600" y2="440" stroke="#2a343c" stroke-width="1"/>
    <text x="104" y="490" fill="#9aa49c" font-size="20">Accept rate</text>
    <text x="600" y="490" text-anchor="end" fill="#e8eee9" font-size="30" font-weight="600">18%</text>
    <line x1="104" y1="520" x2="600" y2="520" stroke="#2a343c" stroke-width="1"/>
    <text x="104" y="570" fill="#9aa49c" font-size="20">Trust score</text>
    <text x="600" y="570" text-anchor="end" fill="#5affb0" font-size="30" font-weight="600">0.91</text>
    <line x1="104" y1="600" x2="600" y2="600" stroke="#2a343c" stroke-width="1"/>
  </g>
  <text x="104" y="650" fill="#6b7870" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16">Reputation is public. Gate rules stay private.</text>

  <g transform="translate(740, 200)">
    <rect width="340" height="340" rx="40" fill="#050607" stroke="#3a4550" stroke-width="3"/>
    <rect x="18" y="18" width="304" height="304" rx="28" fill="url(#plate)"/>
    <rect x="78" y="70" width="184" height="22" fill="url(#signal)"/>
    <rect x="90" y="92" width="20" height="176" fill="#e8eee9"/>
    <rect x="136" y="92" width="20" height="176" fill="#c5cdc7"/>
    <rect x="184" y="92" width="20" height="176" fill="#c5cdc7"/>
    <rect x="230" y="92" width="20" height="176" fill="#e8eee9"/>
    <rect x="78" y="160" width="184" height="20" fill="url(#signal)"/>
    <rect x="78" y="268" width="184" height="14" fill="#5a6560"/>
  </g>

  <text x="600" y="780" text-anchor="middle" fill="#e8eee9" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="700">Reputation is the product</text>
  <text x="600" y="835" text-anchor="middle" fill="#6b7870" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="4">PUBLIC LEDGER · TRUST SCORE</text>
</svg>
