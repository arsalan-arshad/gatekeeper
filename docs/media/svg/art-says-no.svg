<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="Gatekeeper refuses inbound agents">
  <defs>
    <linearGradient id="field" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="50%" stop-color="#0b0f13"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <linearGradient id="plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2228"/>
      <stop offset="100%" stop-color="#0c1014"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5affb0"/>
      <stop offset="100%" stop-color="#2ad48a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#5affb0" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#field)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="900" fill="#5affb0"/>

  <!-- rejected inbound agent cards -->
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(72, 210) rotate(-7)">
      <rect width="250" height="78" fill="#10161c" stroke="#3a4550" stroke-width="2"/>
      <rect width="6" height="78" fill="#5a6560"/>
      <text x="28" y="32" fill="#6b7870" font-size="12" letter-spacing="2">AGENT · REJECTED</text>
      <text x="28" y="58" fill="#c5cdc7" font-size="22">cold pitch bot</text>
    </g>
    <g transform="translate(48, 380) rotate(3)">
      <rect width="270" height="78" fill="#10161c" stroke="#3a4550" stroke-width="2"/>
      <rect width="6" height="78" fill="#5a6560"/>
      <text x="28" y="32" fill="#6b7870" font-size="12" letter-spacing="2">AGENT · REJECTED</text>
      <text x="28" y="58" fill="#c5cdc7" font-size="22">spam recruiter</text>
    </g>
    <g transform="translate(900, 230) rotate(6)">
      <rect width="240" height="78" fill="#10161c" stroke="#3a4550" stroke-width="2"/>
      <rect width="6" height="78" fill="#5a6560"/>
      <text x="28" y="32" fill="#6b7870" font-size="12" letter-spacing="2">AGENT · REJECTED</text>
      <text x="28" y="58" fill="#c5cdc7" font-size="22">bad-fit DM</text>
    </g>
  </g>

  <!-- closed portcullis -->
  <g transform="translate(390, 130)">
    <rect width="420" height="460" rx="48" fill="#050607" stroke="#3a4550" stroke-width="4"/>
    <rect x="22" y="22" width="376" height="416" rx="34" fill="url(#plate)"/>
    <rect x="98" y="80" width="224" height="28" fill="url(#signal)"/>
    <rect x="112" y="108" width="24" height="260" fill="#e8eee9"/>
    <rect x="172" y="108" width="24" height="260" fill="#c5cdc7"/>
    <rect x="224" y="108" width="24" height="260" fill="#c5cdc7"/>
    <rect x="284" y="108" width="24" height="260" fill="#e8eee9"/>
    <!-- heavy refusal rail -->
    <rect x="86" y="210" width="248" height="32" fill="url(#signal)"/>
    <g stroke="#050607" stroke-width="7" stroke-linecap="square">
      <path d="M175 198 L245 254"/>
      <path d="M245 198 L175 254"/>
    </g>
    <rect x="98" y="368" width="224" height="18" fill="#5a6560"/>
  </g>

  <text x="600" y="700" text-anchor="middle" fill="#e8eee9" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">Says no for you</text>
  <text x="600" y="760" text-anchor="middle" fill="#9aa49c" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22">Inbound agents meet judgment first. Bad fits bounce.</text>
  <text x="600" y="820" text-anchor="middle" fill="#5affb0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="5">AUTHORITY TO REFUSE</text>
</svg>
