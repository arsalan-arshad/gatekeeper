<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-label="Gatekeeper GitHub banner">
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="50%" stop-color="#0b0f13"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <linearGradient id="plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2228"/>
      <stop offset="100%" stop-color="#0c1014"/>
    </linearGradient>
    <linearGradient id="signal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5affb0"/>
      <stop offset="100%" stop-color="#2ad48a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#5affb0" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="5" fill="#5affb0"/>
  <rect x="0" y="635" width="1280" height="5" fill="#252d34"/>

  <g transform="translate(516, 70)">
    <rect width="248" height="248" rx="32" fill="#050607" stroke="#3a4550" stroke-width="3"/>
    <rect x="14" y="14" width="220" height="220" rx="22" fill="url(#plate)"/>
    <rect x="56" y="48" width="136" height="18" fill="url(#signal)"/>
    <rect x="64" y="66" width="14" height="128" fill="#e8eee9"/>
    <rect x="98" y="66" width="14" height="128" fill="#c5cdc7"/>
    <rect x="136" y="66" width="14" height="128" fill="#c5cdc7"/>
    <rect x="170" y="66" width="14" height="128" fill="#e8eee9"/>
    <rect x="56" y="116" width="136" height="16" fill="url(#signal)"/>
    <rect x="56" y="194" width="136" height="12" fill="#5a6560"/>
  </g>

  <text x="640" y="380" text-anchor="middle" fill="#5affb0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="8">OPEN SOURCE · AI PRINCIPAL</text>
  <text x="640" y="470" text-anchor="middle" fill="#e8eee9" font-family="Syne, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="800">Gatekeeper</text>
  <text x="640" y="530" text-anchor="middle" fill="#9aa49c" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="26">The front door that can refuse</text>
  <text x="640" y="580" text-anchor="middle" fill="#6b7870" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="3">AUTHORITY · JUDGMENT · REPUTATION</text>
</svg>
