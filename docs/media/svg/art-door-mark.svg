<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="Gatekeeper arched doorway mark">
  <defs>
    <linearGradient id="sky" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#07110e"/>
      <stop offset="50%" stop-color="#0b1210"/>
      <stop offset="100%" stop-color="#101a16"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#5fd4a4" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#5fd4a4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5fd4a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2c24"/>
      <stop offset="55%" stop-color="#0d1713"/>
      <stop offset="100%" stop-color="#080e0b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd4a4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5fd4a4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1b6b4f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef3ef" stop-opacity="0"/>
      <stop offset="40%" stop-color="#eef3ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#eef3ef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#bloom)"/>

  <g transform="translate(420, 90)">
    <ellipse cx="180" cy="340" rx="260" ry="320" fill="#5fd4a4" fill-opacity="0.12"/>
    <path d="M40 720 V280 A140 140 0 0 1 320 280 V720 Z" fill="url(#doorFace)" stroke="url(#rim)" stroke-width="7"/>
    <path d="M92 680 V308 A88 88 0 0 1 268 308 V680 Z" fill="#050805" stroke="#eef3ef" stroke-opacity="0.1" stroke-width="3"/>
    <path d="M112 318 A68 68 0 0 1 248 318" stroke="#5fd4a4" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
    <path d="M62 680 V300 A118 118 0 0 1 180 182 V680 Z" fill="url(#sheen)"/>
    <circle cx="248" cy="460" r="8" fill="#5fd4a4"/>
  </g>

  <text x="600" y="840" text-anchor="middle" fill="#8fa198" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" letter-spacing="4">THE FRONT DOOR</text>
</svg>
