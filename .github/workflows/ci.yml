name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Workspace packages export compiled dist/; build before tests that import them.
      - name: Build packages
        run: pnpm --filter @gatekeeper/db build

      - name: Test
        run: pnpm test

      - name: Prod OG must not use localhost
        env:
          NEXT_PUBLIC_SITE_URL: https://gatekeeper.arsalandev.studio
          APP_URL: https://gatekeeper.arsalandev.studio
          API_URL: https://api.gatekeeper.arsalandev.studio
          NEXT_PUBLIC_API_URL: https://api.gatekeeper.arsalandev.studio
          AUTH_SECRET: ci-auth-secret-for-og-grep-only!
        run: |
          # next/font Google fetch can flake on runners — retry the build a few times.
          for i in 1 2 3; do
            if pnpm --filter @gatekeeper/web build; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "web build failed after 3 attempts" >&2
              exit 1
            fi
            echo "web build failed (attempt $i); retrying…"
            rm -rf apps/web/.next
            sleep 5
          done
          # Grep prerendered HTML/body only (not server JS bundles that keep localhost API fallbacks).
          if grep -RInE 'localhost|127\.0\.0\.1' apps/web/.next/server/app \
            --include='*.html' --include='*.body' 2>/dev/null; then
            echo "Found localhost in production HTML output" >&2
            exit 1
          fi
          grep -q 'https://gatekeeper.arsalandev.studio' apps/web/.next/server/app/index.html
          grep -q 'https://gatekeeper.arsalandev.studio/sitemap.xml' apps/web/.next/server/app/robots.txt.body
          echo "No localhost in prod HTML; OG host is gatekeeper.arsalandev.studio."

      - name: Judge eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ] && [ -z "${GROQ_API_KEY}" ]; then
            echo "No LLM API secrets configured — skipping live judge eval (accuracy gate inactive)."
            exit 0
          fi
          pnpm eval:judge

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gatekeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gatekeeper
      AUTH_SECRET: e2e-auth-secret-for-ci-only-32ch
      E2E_ENABLED: '1'
      E2E_SECRET: e2e-ci-secret
      INTERNAL_API_SECRET: e2e-internal-api-secret-for-ci-only
      APP_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package
        run: pnpm --filter @gatekeeper/db build

      - name: Install Playwright Chromium
        run: pnpm e2e:install

      - name: Run Playwright e2e
        run: pnpm e2e
